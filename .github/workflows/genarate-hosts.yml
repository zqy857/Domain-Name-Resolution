name: Auto Generate Hosts
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate hosts file
        run: |
          echo "# Auto-generated hosts, do not edit manually" > hosts.txt
          while IFS= read -r domain; do
            if [[ -n "$domain" ]]; then
              ip6=$(dig +short AAAA "$domain" | head -n1)
              if [[ -n "$ip6" ]]; then
                echo "$ip6  $domain" >> hosts.txt
              fi
            fi
          done < domains.txt

      - name: Commit file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "update hosts"
          git push || true
